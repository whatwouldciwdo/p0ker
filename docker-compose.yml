version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: p0ker_postgres
    environment:
      POSTGRES_DB: poker
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/server/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: p0ker_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
